<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система шифрования</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1> Система шифрования</h1>
            <p>Шифрование и дешифрование текста с использованием различных алгоритмов</p>
        </header>

        <main>
            <div class="algorithm-selector">
                <label for="algorithm">Выберите алгоритм:</label>
                <select id="algorithm">
                    <option value="caesar">Caesar Cipher (Шифр Цезаря)</option>
                    <option value="vigenere">Vigenère Cipher (Шифр Виженера)</option>
                    <option value="xor">XOR Cipher</option>
                </select>
            </div>

            <div class="input-section">
                <div class="input-group">
                    <label for="inputText">Введите текст:</label>
                    <textarea id="inputText" rows="6" placeholder="Введите текст для шифрования или дешифрования..."></textarea>
                </div>

                <div class="key-section" id="keySection">
                    <div class="input-group">
                        <label for="keyInput">Ключ:</label>
                        <input type="text" id="keyInput" placeholder="Введите ключ...">
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="encryptBtn" class="btn btn-primary">🔒 Зашифровать</button>
                    <button id="decryptBtn" class="btn btn-primary">🔓 Дешифровать</button>
                    <button id="clearBtn" class="btn btn-secondary">🗑️ Очистить</button>
                </div>

                <div class="output-section">
                    <div class="input-group">
                        <label for="outputText">Результат:</label>
                        <textarea id="outputText" rows="6" readonly placeholder="Результат будет отображен здесь..."></textarea>
                    </div>
                    <button id="copyBtn" class="btn btn-secondary">📋 Копировать результат</button>
                </div>
            </div>
        </main>

        <footer>
            
        </footer>
    </div>

    <script src="encryption.js"></script>
    <script src="app.js"></script>
</body>
</html>
